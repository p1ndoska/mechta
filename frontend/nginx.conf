server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Админка: страница открывается только с IP из ADMIN_ALLOWED_IPS (проверяет backend), иначе 403
    location ^~ /administrator {
        auth_request /_admin_ip_check;
        error_page 403 @admin_forbidden;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /_admin_ip_check {
        internal;
        proxy_pass http://backend:3002/api/admin/ip-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @admin_forbidden {
        default_type "text/html; charset=utf-8";
        return 403 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>403</title></head><body style="font-family:system-ui,sans-serif;text-align:center;padding:80px 20px;color:#333"><h1>403</h1><p>Доступ запрещён</p><p style="color:#888;font-size:13px">Ваш IP: $remote_addr</p></body></html>';
    }

    # Картинки: без подмены на index.html и без долгого кэша, чтобы новые файлы сразу появлялись
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
