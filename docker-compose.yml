# По умолчанию собирается из готовой сборки (download-prebuilt.bat), npm не нужен.
# Полная сборка с npm: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mechta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mechta}
      POSTGRES_DB: ${POSTGRES_DB:-mechta}
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mechta} -d ${POSTGRES_DB:-mechta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prebuilt
      network: none
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-mechta}:${POSTGRES_PASSWORD:-mechta}@db:5432/${POSTGRES_DB:-mechta}?schema=public
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-127.0.0.1,::1,172.16.0.0/12,192.168.65.0/24}
      ADMIN_NAME: ${ADMIN_NAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-}
    # API доступен напрямую только с этого компьютера, снаружи — через сайт (nginx)
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
      network: none
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  db_data:
